name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start the mock and run the tests
        # Test order is shuffled on every run by pytest-randomly (installed from requirements.txt).
        run: |
          uvicorn mock.app:app --port 8000 &
          pytest -v --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-report
          path: reports/